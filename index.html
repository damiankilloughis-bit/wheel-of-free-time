<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wheel of Free Time</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Free Time">
<meta name="theme-color" content="#1b1b2f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif; background:#1b1b2f; color:#f4f4f8;
         padding: env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom)); }
  h1 { text-align:center; font-size:1.5rem; margin:18px 0 6px; }
  .sub { text-align:center; opacity:.7; margin:0 0 10px; font-size:.95rem; }
  .wheelwrap { position:relative; width:min(92vw, 460px); margin:0 auto; aspect-ratio:1; }
  canvas { width:100%; height:100%; display:block; touch-action: none; cursor:grab; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .pointer { position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:0; height:0;
             border-left:18px solid transparent; border-right:18px solid transparent; border-top:34px solid #fff;
             filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); z-index:2; }
  button { font: inherit; font-weight:700; border:0; border-radius:14px; padding:14px 20px; cursor:pointer; }
  #spin { display:block; margin:16px auto; font-size:1.3rem; padding:16px 48px; background:#ffca3a; color:#1b1b2f;
          box-shadow:0 4px 0 #b88a00; }
  #spin:disabled { opacity:.5; }
  #now { text-align:center; font-weight:800; font-size:1.25rem; min-height:1.6em; margin:2px auto 16px; padding:4px 14px;
         width:fit-content; max-width:92vw; border-radius:999px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); transition:background .12s; }
  #result { display:none; max-width:680px; margin:10px auto; background:#26264a; border-radius:18px; padding:18px; }
  #result h2 { margin:0 0 4px; font-size:1.35rem; cursor:pointer; }
  .openLesson { display:block; width:100%; margin:6px 0 4px; background:#ffca3a; color:#1b1b2f; font-size:1.05rem; }
  .tag { display:inline-block; font-size:.75rem; padding:2px 8px; border-radius:999px; background:#3d3d70; margin-bottom:10px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
  .row button { flex:1 1 140px; background:#1982c4; color:#fff; }
  #timerBtn.running { background:#8ac926; color:#1b1b2f; }
  #timer { font-variant-numeric: tabular-nums; }
  .links a, #lesson a { color:#7fd4ff; }
  .links { padding-left:18px; }
  #lesson { line-height:1.5; overflow-wrap:anywhere; }
  #lesson table { border-collapse:collapse; font-size:.9rem; display:block; overflow-x:auto; }
  #lesson td, #lesson th { border:1px solid #4a4a80; padding:4px 6px; }
  #lesson hr { border:0; border-top:1px solid #4a4a80; }
  .toast { position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:#fff; color:#111; padding:10px 16px;
           border-radius:12px; font-weight:600; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<h1>🎡 Wheel of Free Time</h1>
<p class="sub">Got 15 minutes? Flick the wheel (or tap SPIN).</p>
<div id="now" aria-live="polite">&nbsp;</div>
<div class="wheelwrap">
  <div class="pointer"></div>
  <canvas id="wheel" width="920" height="920" aria-label="Tap to spin"></canvas>
</div>
<button id="spin">SPIN</button>

<div id="result">
  <h2 id="rName" title="Tap to open the lesson"></h2>
  <span class="tag" id="rType"></span>
  <button id="openLesson" class="openLesson">📖 Open lesson</button>
  <div class="row">
    <button id="timerBtn">⏱ Start <span id="timer">15:00</span></button>
    <button id="copyBtn">📋 Copy for Spark</button>
  </div>
  <ul class="links" id="rLinks"></ul>
  <div id="lesson"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var COLORS = ["#ff595e","#ff924c","#ffca3a","#8ac926","#1982c4","#6a4c93","#f15bb5","#00bbf9","#9d4edd","#2a9d8f"];
  var canvas = document.getElementById("wheel");
  var ctx = canvas.getContext("2d");
  var spinBtn = document.getElementById("spin");
  var items = [];
  var rotation = 0;           // radians
  var spinning = false;
  var current = null;
  var omega = 0;              // angular velocity, rad/s (positive = clockwise)

  function randInt(n) {       // uniform integer in [0, n) via rejection sampling
    var buf = new Uint32Array(1), limit = Math.floor(0x100000000 / n) * n;
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % n;
  }
  function randFloat() { var b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] / 0x100000000; }

  // Wheel art is rendered once into offscreen canvases (with and without labels),
  // then drawn rotated each frame. Above a speed threshold, faded trailing copies give motion blur.
  var artFull = null, artPlain = null, artKey = "";
  function buildArt() {
    var W = canvas.width, c = W / 2, r = c - 8, n = items.length || 1, seg = 2 * Math.PI / n;
    function make(withLabels) {
      var oc = document.createElement("canvas"); oc.width = W; oc.height = W;
      var g = oc.getContext("2d");
      for (var i = 0; i < n; i++) {
        var a0 = i * seg;
        g.beginPath(); g.moveTo(c, c); g.arc(c, c, r, a0, a0 + seg); g.closePath();
        g.fillStyle = COLORS[i % COLORS.length]; g.fill();
        g.lineWidth = 4; g.strokeStyle = "#1b1b2f"; g.stroke();
        if (!withLabels || !items[i]) continue;
        g.save(); g.translate(c, c); g.rotate(a0 + seg / 2);
        g.textAlign = "right"; g.textBaseline = "middle";
        g.fillStyle = "#fff"; g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = 6;
        var label = items[i].label, size = 40;
        g.font = "700 " + size + "px system-ui, sans-serif";
        while (g.measureText(label).width > r - 110 && size > 18) { size -= 2; g.font = "700 " + size + "px system-ui, sans-serif"; }
        g.fillText(label, r - 22, 0);
        g.restore();
      }
      return oc;
    }
    artFull = make(true); artPlain = make(false);
    artKey = items.map(function (it) { return it.label; }).join("|");
  }
  var lastDrawRot = 0, lastDrawT = 0, visSpeed = 0;   // smoothed on-screen angular speed (rad/s)
  var BLUR_START = 18, LABEL_FADE_END = 45;
  function blit(img, angle, alpha) {
    var W = canvas.width, c = W / 2;
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(c, c); ctx.rotate(angle); ctx.drawImage(img, -c, -c); ctx.restore();
  }
  function draw() {
    var key = items.map(function (it) { return it.label; }).join("|");
    if (!artFull || key !== artKey) buildArt();
    var now = performance.now(), dt = (now - lastDrawT) / 1000;
    if (dt > 0 && dt < 0.25) {
      var inst = Math.abs(rotation - lastDrawRot) / dt;
      visSpeed = visSpeed * 0.6 + inst * 0.4;
    } else if (dt >= 0.25) visSpeed = 0;
    lastDrawRot = rotation; lastDrawT = now;
    var W = canvas.width, c = W / 2;
    ctx.clearRect(0, 0, W, W);
    var dir = (typeof omega === "number" && omega < 0) ? -1 : 1;
    if (visSpeed > BLUR_START) {
      // labels fade out between BLUR_START and LABEL_FADE_END
      var fade = Math.max(0, Math.min(1, (visSpeed - BLUR_START) / (LABEL_FADE_END - BLUR_START)));
      var spread = Math.min(visSpeed / 60, 1.2);          // trailing arc ~ one frame of motion, capped
      var GHOSTS = 7;
      blit(artPlain, rotation, 1);
      for (var gI = GHOSTS; gI >= 1; gI--) blit(artPlain, rotation - dir * spread * gI / GHOSTS, 0.22 * (1 - gI / (GHOSTS + 1)));
      if (fade < 1) blit(artFull, rotation, 1 - fade);
    } else {
      blit(artFull, rotation, 1);
    }
    ctx.beginPath(); ctx.arc(c, c, 54, 0, 2 * Math.PI); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.fillStyle = "#1b1b2f"; ctx.font = "800 30px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("SPIN", c, c);
    updateBanner();
  }
  var bannerEl = null, bannerIdx = -2, bannerBlur = null;
  function updateBanner() {
    if (!items.length) return;
    bannerEl = bannerEl || document.getElementById("now");
    var idx = sliceUnderPointer(), blur = visSpeed > 60;
    if (idx === bannerIdx && blur === bannerBlur) return;
    bannerIdx = idx; bannerBlur = blur;
    bannerEl.textContent = blur ? "🌀 spinning…" : "▼ " + items[idx].label;
    bannerEl.style.background = blur ? "#3d3d70" : COLORS[idx % COLORS.length];
  }

  var TWO_PI = 2 * Math.PI;
  function sliceUnderPointer() {
    var n = items.length || 1, seg = TWO_PI / n;
    return Math.floor((((-Math.PI / 2 - rotation) % TWO_PI + TWO_PI) % TWO_PI) / seg) % n;
  }
  function setBusy(b) { spinBtn.disabled = b; }

  // ---- tick feedback as slices pass the pointer (throttled) ----
  var lastSlice = -1, lastTick = 0, audioCtx = null;
  function ensureAudio() {
    try { if (!audioCtx) { var A = window.AudioContext || window.webkitAudioContext; if (A) audioCtx = new A(); }
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); } catch (e) {}
  }
  function tick() {
    var idx = sliceUnderPointer();
    if (idx === lastSlice) return;
    lastSlice = idx;
    var now = performance.now();
    if (visSpeed > 60) return;                                       // a blur: no ticks
    var gap = visSpeed > 25 ? 110 : 60;
    if (now - lastTick < gap) return;
    lastTick = now;
    if (navigator.vibrate && visSpeed < 25) { try { navigator.vibrate(6); } catch (e) {} }
    if (audioCtx && audioCtx.state === "running") {
      try { var o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
        o.type = "square"; o.frequency.value = 1800; g.gain.setValueAtTime(0.04, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
        o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.035); } catch (e) {}
    }
  }

  // ---- SPIN button: uniform crypto pick, tweened to land on it ----
  var tweening = false;
  function animateTo(pick, dur, extraTurns, jitter) {
    tweening = true; spinning = true; setBusy(true);
    var n = items.length, seg = TWO_PI / n;
    var target = -Math.PI / 2 - (pick + 0.5) * seg + jitter;       // slice under the top pointer
    var delta = ((target - rotation) % TWO_PI + TWO_PI) % TWO_PI;
    var start = rotation, end = rotation + delta + TWO_PI * extraTurns, t0 = null;
    function ease(t) { return 1 - Math.pow(1 - t, 4); }
    function frame(ts) {
      if (t0 === null) t0 = ts;
      var t = dur > 0 ? Math.min(1, (ts - t0) / dur) : 1;
      rotation = start + (end - start) * ease(t);
      draw(); tick();
      if (t < 1) requestAnimationFrame(frame);
      else { rotation = ((end % TWO_PI) + TWO_PI) % TWO_PI; tweening = false; spinning = false; setBusy(false); showResult(items[pick]); }
    }
    requestAnimationFrame(frame);
  }
  function spin() {
    if (spinning || !items.length) return;
    var n = items.length, seg = TWO_PI / n;
    var pick = randInt(n);                                         // uniform, unweighted
    var jitter = (randFloat() - 0.5) * seg * 0.7;                  // land inside the slice, not on an edge
    animateTo(pick, 4200, 5 + randInt(2), jitter);
  }

  // ---- finger physics (flick, inertia, add speed, hold to brake) ----
  var MAX_OMEGA = 150;         // rad/s (~24 turns per second)
  var MIN_FLICK = 1.2;         // rad/s needed on release to count as a flick
  var fK = 0.25, fC = 1.0;     // friction (fixed, deterministic): domega/dt = -(fK*|omega| + fC)
  var BK = 6, BC = 12;         // brake friction while a finger is held still on the wheel
  var session = false, total = 0;  // total = |rotation| moved by hand or coasting since last rest
  var MIN_MOVE = 0.15;         // rad (~9°): smaller nudges never pop a result
  var loopOn = false, lastTs = null;
  var ptr = null;              // active pointer state

  // Exact solution of domega/dt = -(k*w + c) over dt, so landing doesn't depend on frame timing.
  function coast(dt, k, c) {
    var w0 = Math.abs(omega), sign = omega > 0 ? 1 : -1;
    var tz = Math.log((k * w0 + c) / c) / k;                         // time until it would stop
    var t = Math.min(dt, tz), A = w0 + c / k, e = Math.exp(-k * t);
    var dTheta = A * (1 - e) / k - (c / k) * t;
    var w1 = t >= tz ? 0 : A * e - c / k;
    rotateBy(sign * dTheta);
    omega = sign * w1;
  }
  function angleAt(e) {
    var r = canvas.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
  }
  function wrap(d) { while (d > Math.PI) d -= TWO_PI; while (d < -Math.PI) d += TWO_PI; return d; }
  function rotateBy(d) { rotation += d; total += Math.abs(d); }

  function startLoop() { if (!loopOn) { loopOn = true; lastTs = null; requestAnimationFrame(loop); } }
  function loop(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min(0.25, Math.max(0, (ts - lastTs) / 1000)); lastTs = ts;
    if (omega !== 0) {
      var braking = ptr && (ts - ptr.lastMove) > 90;                  // finger held still = brake
      coast(dt, braking ? BK : fK, braking ? BC : fC);
    }
    draw(); tick();
    if (omega === 0 && !ptr) { loopOn = false; comeToRest(); return; }
    if (omega === 0 && ptr) { loopOn = false; return; }               // held still; pointer handlers take over
    requestAnimationFrame(loop);
  }
  function comeToRest() {
    rotation = ((rotation % TWO_PI) + TWO_PI) % TWO_PI;
    var show = total >= MIN_MOVE;
    session = false; total = 0; spinning = false; setBusy(false);
    draw();
    if (show && items.length) showResult(items[sliceUnderPointer()]);   // same path as the SPIN button
  }

  canvas.addEventListener("pointerdown", function (e) {
    if (tweening || !items.length) return;
    ensureAudio();
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    var now = performance.now(), a = angleAt(e);
    ptr = { id: e.pointerId, angle: a, startX: e.clientX, startY: e.clientY, t0: now, lastMove: now,
            dragging: false, wasMoving: omega !== 0, samples: [{ t: now, a: 0 }], acc: 0 };
    spinning = true; setBusy(true);
    canvas.style.cursor = "grabbing";
    if (omega !== 0) startLoop();
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    e.preventDefault();
    var now = performance.now(), a = angleAt(e), d = wrap(a - ptr.angle);
    ptr.angle = a;
    if (!ptr.dragging) {
      var dx = e.clientX - ptr.startX, dy = e.clientY - ptr.startY;
      if (dx * dx + dy * dy < 64) return;                            // < 8px: still a tap / hold
      ptr.dragging = true;
    }
    ptr.lastMove = now;
    ptr.acc += d;
    rotateBy(d);                                                     // wheel follows the finger (on top of any coasting)
    ptr.samples.push({ t: now, a: ptr.acc });
    while (ptr.samples.length > 2 && now - ptr.samples[0].t > 100) ptr.samples.shift();
    if (omega === 0) draw();
    tick();
  });
  function release(e) {
    if (!ptr || (e && e.pointerId !== ptr.id)) return;
    var now = performance.now(), p = ptr;
    ptr = null; canvas.style.cursor = "grab";
    // finger velocity over the last ~100 ms
    var v = 0, s0 = p.samples[0], s1 = p.samples[p.samples.length - 1];
    if (p.dragging && now - s1.t < 80 && s1.t - s0.t > 8) v = (s1.a - s0.a) / ((s1.t - s0.t) / 1000);
    if (!p.dragging && !p.wasMoving && now - p.t0 < 300) {           // plain tap on a still wheel = random spin
      spinning = false; setBusy(false); spin(); return;
    }
    if (Math.abs(v) >= MIN_FLICK) {
      session = true;
      omega = Math.max(-MAX_OMEGA, Math.min(MAX_OMEGA, omega + v)); // flicking a spinning wheel adds speed
      startLoop();
    } else if (omega !== 0) {
      startLoop();                                                   // let go after a light touch: keep coasting
    } else {
      omega = 0; comeToRest();                                      // released a still wheel: result if it was moved/aimed
    }
  }
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]; }); }
  function md(text) {
    if (window.marked && marked.parse) return marked.parse(text);
    return "<pre style='white-space:pre-wrap'>" + esc(text) + "</pre>";
  }
  function fixLinks(el) { el.querySelectorAll("a").forEach(function (a) { a.target = "_blank"; a.rel = "noopener"; }); }

  var lessonState = "none";    // none | loading | loaded | failed
  function loadLesson(item) {
    var lesson = document.getElementById("lesson");
    var fallback = "<h3>Your 15 minutes</h3><p>" + esc(item.block) + "</p>";
    if (!item.currentLesson) { lesson.innerHTML = fallback; lessonState = "none"; return; }
    lessonState = "loading";
    lesson.innerHTML = "<p>Loading lesson…</p>";
    fetch(item.currentLesson + "?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (t) { if (current === item) { lesson.innerHTML = md(t); fixLinks(lesson); lessonState = "loaded"; } })
      .catch(function () { if (current === item) { lessonState = "failed";
        lesson.innerHTML = "<p>⚠️ Couldn't load the lesson. Tap <b>Open lesson</b> to retry.</p>" + fallback; } });
  }
  function openLesson() {
    if (!current) return;
    if (current.currentLesson && lessonState !== "loaded" && lessonState !== "loading") loadLesson(current);
    document.getElementById("lesson").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function showResult(item) {
    current = item; resetTimer();
    document.getElementById("rName").textContent = item.name;
    document.getElementById("rType").textContent = item.type === "one-off" ? "fun one-off" : (item.type || "skill");
    document.getElementById("openLesson").textContent = item.currentLesson ? "📖 Open lesson" : "📝 Show 15-minute plan";
    var ul = document.getElementById("rLinks");
    ul.innerHTML = (item.links || []).map(function (l) {
      return '<li><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.title) + "</a></li>";
    }).join("");
    var box = document.getElementById("result"); box.style.display = "block";
    loadLesson(item);
    setTimeout(function () { box.scrollIntoView({ behavior: "smooth", block: "start" }); }, 150);
  }


  // 15-minute timer
  var timerEnd = null, timerId = null, timerBtn = document.getElementById("timerBtn"), timerEl = document.getElementById("timer");
  function fmt(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function resetTimer() { clearInterval(timerId); timerId = null; timerEnd = null; timerBtn.classList.remove("running");
    timerBtn.innerHTML = '⏱ Start <span id="timer">15:00</span>'; timerEl = document.getElementById("timer"); }
  function beep() {
    try { var A = window.AudioContext || window.webkitAudioContext, ac = new A();
      [0, 0.4, 0.8].forEach(function (d) { var o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880;
        o.connect(g); g.connect(ac.destination); g.gain.value = 0.3; o.start(ac.currentTime + d); o.stop(ac.currentTime + d + 0.25); });
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  }
  timerBtn.addEventListener("click", function () {
    if (timerId) { resetTimer(); return; }
    timerEnd = Date.now() + 15 * 60 * 1000; timerBtn.classList.add("running");
    timerBtn.innerHTML = '⏹ <span id="timer">15:00</span>'; timerEl = document.getElementById("timer");
    timerId = setInterval(function () {
      var left = timerEnd - Date.now(); timerEl.textContent = fmt(left);
      if (left <= 0) { clearInterval(timerId); timerId = null; timerBtn.innerHTML = "✅ Done! (tap to reset)"; toast("Time's up! Nice work."); beep(); }
    }, 250);
  });

  // Copy for Spark
  function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1800); }
  document.getElementById("copyBtn").addEventListener("click", function () {
    if (!current) return;
    var text = "Spun: " + current.name;
    function legacy() { var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta); toast("Copied: " + text); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast("Copied: " + text); }, legacy);
    else legacy();
  });

  spinBtn.addEventListener("click", spin);
  document.getElementById("openLesson").addEventListener("click", openLesson);
  document.getElementById("rName").addEventListener("click", openLesson);

  fetch("items.json", { cache: "no-cache" }).then(function (r) { return r.json(); })
    .then(function (data) { items = data; draw(); lastSlice = sliceUnderPointer(); })
    .catch(function () { document.querySelector(".sub").textContent = "Couldn't load the list. Pull to refresh."; });
  draw();
  window.__wheel = { spin: spin, items: function () { return items; }, rotation: function () { return rotation; }, omega: function () { return omega; }, under: sliceUnderPointer, maxOmega: MAX_OMEGA, visSpeed: function () { return visSpeed; }, _setRotation: function (r) { rotation = r; draw(); }, lessonState: function () { return lessonState; }, _fling: function (w) { session = true; total = 0; omega = w; spinning = true; setBusy(true); startLoop(); } };
})();
</script>
</body>
</html>
